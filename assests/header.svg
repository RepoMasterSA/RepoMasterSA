<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Shaurya Agrawal - Generative AI, RAG Systems, MLOps" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#121c2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9z" fill="#64748b"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="320" fill="#38bdf8"/>

  <!-- left: identity -->
  <text x="70" y="82" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#64748b" letter-spacing="2">~/RepoMasterSA</text>
  <text x="68" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="#f8fafc" letter-spacing="-1">Shaurya Agrawal</text>
  <text x="70" y="203" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#94a3b8" letter-spacing="0.5">Generative AI  ·  RAG Systems  ·  MLOps</text>
  <text x="70" y="264" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#38bdf8">&gt; systems that verify their own answers<tspan dx="4">_<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- right: self-correcting RAG motif -->
  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" text-anchor="middle">
    <text x="740" y="112" fill="#64748b" font-size="12" letter-spacing="1.5">QUERY</text>
    <text x="1085" y="112" fill="#64748b" font-size="12" letter-spacing="1.5">ANSWER</text>

    <rect x="695" y="132" width="90" height="36" rx="7" fill="#0f172a" stroke="#334155"/>
    <text x="740" y="155" fill="#e2e8f0">retrieve</text>
    <rect x="810" y="132" width="90" height="36" rx="7" fill="#0f172a" stroke="#38bdf8"/>
    <text x="855" y="155" fill="#e2e8f0">grade</text>
    <rect x="925" y="132" width="90" height="36" rx="7" fill="#0f172a" stroke="#334155"/>
    <text x="970" y="155" fill="#e2e8f0">generate</text>
    <rect x="1040" y="132" width="90" height="36" rx="7" fill="#0f172a" stroke="#38bdf8"/>
    <text x="1085" y="155" fill="#e2e8f0">verify</text>

    <path d="M785 150H806" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M900 150H921" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M1015 150H1036" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

    <path d="M1085 168 L1085 205 Q1085 215 1075 215 L750 215 Q740 215 740 205 L740 172" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrLoop)">
      <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <text x="912" y="240" fill="#64748b" font-size="12" letter-spacing="1.5">REVISE IF NOT GROUNDED</text>

    <circle r="4" fill="#38bdf8">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M695 150 H1130"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
