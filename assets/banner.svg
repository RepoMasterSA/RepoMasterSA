<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Building intelligent software from idea to working system" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090e1a"/>
      <stop offset="1" stop-color="#111b2d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- network motif -->
  <g stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1" fill="none">
    <path d="M700 70L790 130L720 200L800 235"/>
    <path d="M790 130L860 60L980 100L900 170L790 130"/>
    <path d="M900 170L1010 215L1090 150L980 100"/>
    <path d="M860 60L960 40L1080 60L1090 150L1150 230L1010 215"/>
    <path d="M720 200L900 170"/>
    <path d="M960 40L980 100"/>
    <path d="M1080 60L980 100"/>
    <path d="M800 235L1010 215"/>
  </g>
  <g fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5">
    <circle cx="700" cy="70" r="4"/><circle cx="790" cy="130" r="5"/><circle cx="720" cy="200" r="4"/>
    <circle cx="860" cy="60" r="4"/><circle cx="900" cy="170" r="5"/><circle cx="980" cy="100" r="6"/>
    <circle cx="1010" cy="215" r="4"/><circle cx="1080" cy="60" r="4"/><circle cx="1090" cy="150" r="5"/>
    <circle cx="1150" cy="230" r="3.5"/><circle cx="800" cy="235" r="3.5"/><circle cx="960" cy="40" r="3.5"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="980" cy="100" r="3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="130" r="2.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="150" r="2.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- text -->
  <rect x="70" y="62" width="36" height="3" fill="#38bdf8"/>
  <text x="68" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Building intelligent software</text>
  <text x="68" y="184" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#7dd3fc" letter-spacing="-0.5">from idea to working system.</text>
  <text x="70" y="228" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#64748b" letter-spacing="3">SOFTWARE ENGINEERING  ·  APPLIED AI  ·  DATA</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
